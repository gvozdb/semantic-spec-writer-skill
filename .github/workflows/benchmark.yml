name: Benchmark fixtures

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/semantic-spec-writer-pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate published Capsule artifacts when present
        shell: bash
        run: |
          set -o pipefail
          env -i PATH="$PATH" LC_ALL=C GIT_NO_REPLACE_OBJECTS=1 GIT_OPTIONAL_LOCKS=0 \
            git --no-pager cat-file blob HEAD:benchmarks/validate_capsule_release.py | \
            python3 -I /dev/stdin

      - name: Validate benchmark fixtures
        run: |
          python3 benchmarks/benchmark.py validate
          python3 benchmarks/handoff.py validate

      - name: Compile benchmark tools
        run: >-
          python3 -m py_compile
          benchmarks/benchmark.py
          benchmarks/context.py
          benchmarks/grader.py
          benchmarks/handoff.py
          benchmarks/lifecycle.py
          benchmarks/solution_runtime.py
          benchmarks/solution_worker.py
          benchmarks/validate_capsule_release.py
          skills/semantic-spec-writer/scripts/check_conversion.py
          skills/semantic-spec-writer/scripts/check_execution_packet.py
          skills/semantic-spec-writer/scripts/context_capsule.py

      - name: Check semantic documents are smaller
        run: |
          python3 benchmarks/benchmark.py static --check
          python3 benchmarks/handoff.py static
          python3 benchmarks/handoff.py static --comparison markdown-capsule-v6

      - name: Smoke-test full Capsule lifecycle
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          python3 -B benchmarks/handoff.py run \
            --comparison markdown-capsule-lifecycle-v1 \
            --provider mock \
            --repetitions 1 \
            --seed 20260901 \
            --timeout-seconds 30 \
            --output "$smoke_dir/result.json"
          python3 -B benchmarks/handoff.py report \
            "$smoke_dir/result.json" \
            --output "$smoke_dir/report.md"
          grep -F "Non-publishable run" "$smoke_dir/report.md"

      - name: Run benchmark harness tests
        run: python3 -W error::ResourceWarning -m unittest discover -s benchmarks/tests -v
